<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opdracht 3.3</title>
    <style>
        table{
            border-collapse: collapse;
        }
    
    th{
    background-color: #B0AFEB; color: white;
    }
    td:first-child{
    background-color: #7371DC;
    }
    td {
        background-color: black;
        color: white;
    }
    .border{
    border-bottom-right-radius: 50px;
    }
    </style>
</head>
<body>
    <h1>Hallo Hi Abonnementenoverzicht</h1>
    <table>
        <tr>
            <th>Abonnement</th>
            <th>Snelheid(Mbps)</th>
            <th>Data</th>
            <th>Maandprijs</th>
        </tr>
        <tr>
            <td>Basic</td>
            <td>300mb/s</td>
            <td>2GB</td>
            <td>16,50,-</td>
        </tr>
        <tr>
            <td>Start</td>
            <td>300mb/s</td>
            <td>10GB</td>
            <td>18,00,-</td>
        </tr>
        <tr>
            <td>Unlimited</td>
            <td>400mb/s</td>
            <td>50GB</td>
            <td>32,50,-</td>
        </tr>
        <tr>
            <td>Unlimited Plus</td>
            <td>700mb/s</td>
            <td>60GB</td>
            <td class="border">37,50,-</td>
        </tr>
    </table>

</html>
